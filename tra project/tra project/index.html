<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <h1>Student Management System</h1>

    <div class="container">

        <h2>Add / Update Student</h2>

        <form id="studentForm" novalidate>

            <input type="hidden" id="studentId">

            <input type="text" id="name" placeholder="Enter Name" minlength="2" maxlength="60" required>

            <input type="email" id="email" placeholder="Enter Email" maxlength="120" required>

            <input type="tel" id="phone" placeholder="Enter Phone" minlength="7" maxlength="20" required>

            <input type="number" id="age" placeholder="Enter Age" min="1" max="120" required>

            <input type="text" id="course" placeholder="Enter Course" minlength="2" maxlength="80" required>

            <input type="text" id="city" placeholder="Enter City" minlength="2" maxlength="80" required>

            <button type="submit" id="submitBtn">Add Student</button>

            <button type="button" onclick="clearForm()">Clear</button>

        </form>

        <hr>

        <h2>Search and Filter</h2>

        <input
            type="text"
            id="search"
            placeholder="Search by name"
            oninput="displayStudents()"
        >

        <input
            type="text"
            id="courseFilter"
            placeholder="Filter by course"
            oninput="displayStudents()"
        >

        <button onclick="loadStudents()">View All Students</button>

        <p id="status" role="status" aria-live="polite"></p>

        <h2>Student List</h2>

        <table border="1">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>City</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
